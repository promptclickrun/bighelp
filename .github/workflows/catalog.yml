name: Template Catalog

# catalog/ holds reviewed source snapshots. Pull requests validate them; publication is an explicit
# manual action so a normal merge cannot overwrite edits or recreate deletions from Catalog Reviewer.

on:
  pull_request:
    paths:
      - catalog/**
      - services/catalog/**
      - .github/workflows/catalog.yml
  push:
    branches: [main]
    paths:
      - catalog/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish repo templates, replacing live reviewer edits for matching IDs
        type: boolean
        default: false
      prune:
        description: Also unpublish live templates that catalog/ doesn't list (reversible)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/catalog/package-lock.json
      - run: npm ci
      # Every file in catalog/ goes through the Worker's own template checks, and the Worker's tests run.
      - run: npm test
      - run: python3 scripts/catalog-sync.py check

  # Only runs on main, never on a pull request, so a pull request can't reach the secrets.
  publish:
    needs: validate
    # Live D1 is the catalog's editing authority. Repo snapshots publish only by explicit manual request.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two merges in a row publish one after the other, each from its own commit.
    concurrency:
      group: catalog-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Update the catalog to match catalog/
        env:
          CATALOG_REVIEW_CLIENT_ID: ${{ secrets.CATALOG_REVIEW_CLIENT_ID }}
          CATALOG_REVIEW_CLIENT_SECRET: ${{ secrets.CATALOG_REVIEW_CLIENT_SECRET }}
          PRUNE: ${{ inputs.prune && '--prune' || '' }}
        run: python3 services/catalog/scripts/catalog-sync.py sync --apply $PRUNE
