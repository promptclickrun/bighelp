name: Bighelp
options:
  minimumXcodeGenVersion: 2.43.0
# Team ID and service keys come from Config/Local.xcconfig (git-ignored).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages:
  BuzzKit:
    path: Vendor/BuzzKit
  ThinkingOrbsKit:
    path: Packages/ThinkingOrbsKit
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
  # Same WebRTC with visionOS builds; its Objective-C classes carry an LK prefix.
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework.git
    revision: c73deceaddd9c07293871ae28f24d4326cc86d62
  # Mac updates. AppKit-only, so only BighelpMacUpdater (a macOS bundle) links it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Bighelp:
    type: application
    platform: auto
    # Native on Vision Pro too (spatial avatar), not the iPad app in a window.
    # The Mac app is this iPad app through Mac Catalyst, signed with Developer ID
    # and shipped as a DMG on GitHub Releases, never uploaded to App Store Connect.
    supportedDestinations: [iOS, visionOS, macCatalyst]
    sources:
      - path: Bighelp
        excludes:
          - GeneratedMedia/README.md
          - GitHub/README.md
          - Resources/Fonts/FONT-PROVENANCE.md
          - Resources/ProviderLogos-PROVENANCE.md
          - Resources/SoulTemplates/README.md
          - Wiki/INTEGRATION.md
      - path: BighelpActivityShared
      - path: BighelpWatchShared
    dependencies:
      - target: BighelpWatch
        embed: true
        destinationFilters: [iOS]
      - target: BighelpNotificationService
        embed: true
        destinationFilters: [iOS, macCatalyst]
      - target: BighelpLiveActivity
        embed: true
        destinationFilters: [iOS, visionOS]
      # Sparkle for the Mac app, loaded at runtime from Contents/PlugIns.
      - target: BighelpMacUpdater
        embed: true
        copy:
          destination: plugins
        destinationFilters: [macCatalyst]
      - package: ThinkingOrbsKit
      - package: WebRTC
        destinationFilters: [iOS, macCatalyst]
      - package: LiveKitWebRTC
        destinationFilters: [visionOS]
      - package: BuzzKit
        product: BuzzKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile
        PRODUCT_NAME: Bighelp
        # The Mac menu bar and Finder show the product name: bighelp.app, "bighelp".
        PRODUCT_NAME[sdk=macosx*]: bighelp
        PRODUCT_MODULE_NAME: Bighelp
        # Surface snapping and room persistence for the spatial avatar need 26.
        XROS_DEPLOYMENT_TARGET: "26.0"
        # The Vision Pro simulator runs only on Apple silicon; LiveKit ships no Intel slice.
        EXCLUDED_ARCHS[sdk=xrsimulator*]: x86_64
        # Vision Pro needs its own layered icon (same art: cream back, orb front).
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]: AppIconVision
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xrsimulator*]: AppIconVision
        # Vision Pro opens extra windows (the agent in the room). iPhone and iPad
        # keep one window, so only the visionOS Info.plist gains a scene manifest.
        GENERATE_INFOPLIST_FILE[sdk=xros*]: YES
        GENERATE_INFOPLIST_FILE[sdk=xrsimulator*]: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=xros*]: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=xrsimulator*]: YES
        INFOPLIST_KEY_UIApplicationPreferredDefaultSceneSessionRole[sdk=xros*]: UIWindowSceneSessionRoleApplication
        INFOPLIST_KEY_UIApplicationPreferredDefaultSceneSessionRole[sdk=xrsimulator*]: UIWindowSceneSessionRoleApplication
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 88
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Bighelp/Bighelp.entitlements
        # CarPlay voice needs Apple's CarPlay entitlement, which device builds
        # can't carry until Apple grants it; the simulator's CarPlay uses this copy.
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Bighelp/BighelpCarPlay.entitlements
        # The Mac app shares the iPhone app's ID, because pushes are addressed to it, but it
        # is never uploaded to App Store Connect. "Optimize for Mac" (family 6) draws at full
        # size with the Mac's own menus and controls. Developer ID wants the hardened runtime.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2,6,7"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Bighelp/BighelpCatalyst.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bighelp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          BIGHELP_APS_ENVIRONMENT: development
        Release:
          BIGHELP_APS_ENVIRONMENT: production
  BighelpWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: BighelpWatch
      - path: BighelpWatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.watchkitapp
        PRODUCT_NAME: BighelpWatch
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 88
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BighelpWatch/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 4
  BighelpNotificationService:
    type: app-extension
    # The Mac app opens sealed alerts too.
    platform: auto
    supportedDestinations: [iOS, macCatalyst]
    dependencies:
      - package: BuzzKit
        product: BuzzKitNotificationServiceExtension
    sources:
      - path: BighelpNotificationService
      - path: Bighelp/NotificationShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.notification-service
        PRODUCT_NAME: BighelpNotificationService
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 88
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BighelpNotificationService/BighelpNotificationService.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: BighelpNotificationService/BighelpNotificationServiceCatalyst.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2,6"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BighelpNotificationService/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BighelpLiveActivity:
    type: app-extension
    # The Home widgets run on Vision Pro too (visionOS 26); the Live Activity is iOS-only.
    platform: auto
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: BighelpLiveActivity
      - path: BighelpActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.live-activity
        PRODUCT_NAME: BighelpLiveActivity
        XROS_DEPLOYMENT_TARGET: "26.0"
        EXCLUDED_ARCHS[sdk=xrsimulator*]: x86_64
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 88
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BighelpLiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: BighelpLiveActivity/BighelpLiveActivity.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  # The Mac app's updater: Sparkle (AppKit) in a macOS bundle that the Catalyst app
  # loads from Contents/PlugIns (BighelpMacUpdates.swift). iPhone, iPad and Vision Pro
  # builds never build, link or embed it.
  BighelpMacUpdater:
    type: bundle
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BighelpMacUpdater
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.mac-updater
        PRODUCT_NAME: BighelpMacUpdater
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 88
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: BighelpMacUpdaterController
        LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks"
        SKIP_INSTALL: YES
  BighelpMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: BighelpMac
      - path: Bighelp/SharedFoundation
        excludes:
          - BighelpFoundationSessionRecordProjection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.desktop
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 88
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  BighelpMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: BighelpMacTests
    dependencies:
      - target: BighelpMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
  BighelpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BighelpTests
    dependencies:
      - target: Bighelp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
  BighelpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BighelpUITests
    dependencies:
      - target: Bighelp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
  BighelpVisionUITests:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: BighelpVisionUITests
    dependencies:
      - target: Bighelp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.vision-uitests
        GENERATE_INFOPLIST_FILE: YES
  BighelpWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: BighelpWatchUITests
    dependencies:
      - target: BighelpWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.watch-uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BighelpMac:
    shared: true
    build:
      targets:
        BighelpMac: all
    test:
      targets:
        - BighelpMacTests
  Bighelp:
    shared: true
    build:
      targets:
        Bighelp: all
        BighelpNotificationService: all
        BighelpLiveActivity: all
    test:
      targets:
        - BighelpTests
        - BighelpUITests
  BighelpWatch:
    shared: true
    build:
      targets:
        BighelpWatch: all
    test:
      targets:
        - BighelpWatchUITests
  # The Mac app (Mac Catalyst). Scripts/release-mac.sh signs it with Developer ID
  # and posts the DMG to GitHub Releases.
  BighelpCatalyst:
    shared: true
    build:
      targets:
        Bighelp: all
  BighelpVision:
    shared: true
    build:
      targets:
        Bighelp: all
    test:
      targets:
        - BighelpVisionUITests
